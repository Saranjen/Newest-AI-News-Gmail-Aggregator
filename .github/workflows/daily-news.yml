name: Daily news digest

on:
  schedule:
    # Once per day at 13:00 UTC (adjust as needed)
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    # Job-level env so every step (and Python) sees the same SMTP vars — avoids empty MY_EMAIL if a step omits `env:`.
    env:
      GITHUB_ACTIONS: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USE_DATABASE_URL: ${{ secrets.USE_DATABASE_URL }}
      # Repository secrets — names must match exactly (case-sensitive): EMAIL_SENDER and/or MY_EMAIL
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      MY_EMAIL: ${{ secrets.MY_EMAIL }}
      EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
      # App accepts either env name; map common secret names from GitHub
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      # Optional overrides (must appear under env: here — repo secrets alone do nothing)
      PIPELINE_HOURS: ${{ secrets.PIPELINE_HOURS }}
      EMAIL_DIGEST_HOURS: ${{ secrets.EMAIL_DIGEST_HOURS }}
      DIGEST_RECIPIENTS_FROM_DB: ${{ secrets.DIGEST_RECIPIENTS_FROM_DB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify SMTP sender is configured
        run: |
          if [ -z "${MY_EMAIL:-}" ] && [ -z "${EMAIL_SENDER:-}" ]; then
            echo "::error::Missing sender: add a Repository Actions secret named MY_EMAIL or EMAIL_SENDER (your Gmail address). Variables tab does not populate secrets.* — use Secrets. Names are case-sensitive."
            exit 1
          fi
          echo "SMTP sender env is set (value not printed)."

      - name: Run daily digest
        run: python -m app.jobs.daily_digest

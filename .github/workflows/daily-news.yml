name: Daily news digest

on:
  schedule:
    # Once per day at 13:00 UTC (adjust as needed)
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    # Job-level env so every step (and Python) sees the same SMTP vars — avoids empty MY_EMAIL if a step omits `env:`.
    env:
      GITHUB_ACTIONS: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USE_DATABASE_URL: ${{ secrets.USE_DATABASE_URL }}
      # Secrets take precedence; fall back to Repository variables (same names) if secrets are empty.
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || vars.EMAIL_SENDER }}
      MY_EMAIL: ${{ secrets.MY_EMAIL || vars.MY_EMAIL }}
      EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
      # App accepts either env name; map common secret names from GitHub
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || vars.GMAIL_APP_PASSWORD }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD || vars.APP_PASSWORD }}
      # Optional overrides (must appear under env: here — repo secrets alone do nothing)
      PIPELINE_HOURS: ${{ secrets.PIPELINE_HOURS }}
      EMAIL_DIGEST_HOURS: ${{ secrets.EMAIL_DIGEST_HOURS }}
      DIGEST_RECIPIENTS_FROM_DB: ${{ secrets.DIGEST_RECIPIENTS_FROM_DB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify SMTP sender is configured
        run: |
          python << 'PY'
          import os, sys
          s = (os.getenv("MY_EMAIL") or os.getenv("EMAIL_SENDER") or "").strip()
          if not s:
              print("::error::Missing sender: set Repository secret or variable MY_EMAIL or EMAIL_SENDER to your Gmail address (no spaces-only values). secrets.MY_EMAIL must be non-empty in Actions env.")
              sys.exit(1)
          print("SMTP sender is non-empty after strip (address not printed).")
          PY

      - name: Run daily digest
        env:
          # Repeat job env so this step always receives sender/password even if the job definition changes.
          MY_EMAIL: ${{ secrets.MY_EMAIL || vars.MY_EMAIL }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || vars.EMAIL_SENDER }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD || vars.APP_PASSWORD }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || vars.GMAIL_APP_PASSWORD }}
        run: python -m app.jobs.daily_digest
